name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: amrutam_test
          POSTGRES_USER: amrutam
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amrutam -d amrutam_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://amrutam:test-password@localhost:5432/amrutam_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: test-secret-at-least-thirty-two-characters
      MFA_ENCRYPTION_KEY: D5KMy6hAr2zk5Ig76orQPtLXAHXv1PbWrqvXA3aZqDE=
      ENVIRONMENT: test
      REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "pip>=26.2,<27"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m compileall -q app alembic tests scripts
      - run: alembic upgrade head
      - run: pytest -q
      - run: pip-audit --skip-editable
      - run: docker build -t amrutam-api:ci .
