[project]
name = "amrutam-telemedicine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3", "argon2-cffi>=23.1,<26", "pyotp>=2.9,<3", "cryptography>=43,<47",
  "redis>=5,<7", "prometheus-client>=0.20,<1",
  "opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-instrumentation-sqlalchemy>=0.48b0,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<2", "pip-audit>=2.7,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]



[tool.ruff.lint.per-file-ignores]
'*.py' = ['B008']
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]
